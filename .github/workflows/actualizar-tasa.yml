name: Actualizar tasa USDT

on:
  schedule:
    # Corre cada 10 minutos (evitando el minuto 0, el más saturado). El script solo consulta
    # Binance si el valor guardado tiene más de 25 minutos, así queda cada ~30 minutos aunque
    # GitHub se salte alguna ejecución.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:       # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-tasa
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar Binance P2P
        env:
          FORZAR: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: |
          SCRIPT=$(find . -name actualizar_tasa.py -not -path "./.git/*" | head -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: no se encontró actualizar_tasa.py en el repositorio. Archivos presentes:"
            find . -not -path "./.git/*" -type f | sort
            exit 1
          fi
          echo "Usando $SCRIPT"
          python "$SCRIPT"

      - name: Guardar tasa.json
        run: |
          git config user.name "tasa-bot"
          git config user.email "tasa-bot@users.noreply.github.com"
          git add tasa.json
          if git diff --cached --quiet; then
            echo "tasa.json sin cambios; no hay nada que guardar."
            exit 0
          fi
          git commit -m "Actualizar tasa USDT/VES"
          # Si el repositorio recibió otros cambios mientras corría, se integran y se reintenta.
          for intento in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Intento $intento falló; reintentando..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "No se pudo guardar tasa.json después de 3 intentos."
          exit 1
